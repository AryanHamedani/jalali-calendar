# Keeps the event data in step with time.ir. Occasions repeat on their own
# calendar's date, so what moves is when each Hijri month begins, fixed by
# sighting the moon; once a week this year and the next are fetched again.
# Changes, and any occasion time.ir has that the bundled lists don't, arrive
# as a pull request, to be read before they ship.
name: sync events
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency: sync-events
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch this Jalali year and the next
        run: |
          year=$(python3 -c 'import sys; sys.path[:0] = ["lib"]; import jalali; print(jalali.jalali_for(jalali.date.today())[0])')
          bin/fetch-events "$year" "$((year + 1))" > report.md
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add events tests/timeir-holidays.json
          if git diff --cached --quiet && [ ! -s report.md ]; then echo "Already in step with time.ir"; exit 0; fi
          {
            if [ -s report.md ]; then
              echo "time.ir has these, and the bundled lists don't. Add each to its list (national.json, international.json, hijri.json, history.json or once.json) with an English title in en.json, or to skipped.json:"
              echo; cat report.md; echo
            fi
            git diff --cached --quiet || echo "Data changed (before → after):"
            echo
            for f in $(git diff --cached --name-only -- events); do
              echo "**$f**"
              jq -rn --argjson old "$(git show "HEAD:$f" 2>/dev/null || echo '{}')" --slurpfile new "$f" '
                $new[0] as $n | ([$old, $n] | map(keys) | add | unique)[] as $k
                | select($old[$k] != $n[$k])
                | "- \($k): \($old[$k] | if . then "`\(tojson)`" else "none" end) → \($n[$k] | if . then "`\(tojson)`" else "none" end)"'
              echo
            done
            # A pull request opened with GITHUB_TOKEN gets no test run of its own.
            if python3 -m unittest discover -s tests >test.log 2>&1; then
              echo "Tests pass with the new data."
            else
              echo "**Tests fail with the new data.** Read the failures below before merging:"
              echo; echo '```'; tail -n 30 test.log; echo '```'
            fi
          } > body.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Someone has worked on the open pull request: leave their commits
          # alone, and post this week's findings there instead.
          humans=$(gh pr view events-sync --json state,commits -q 'select(.state == "OPEN") | [.commits[].authors[].email | select(. != "41898282+github-actions[bot]@users.noreply.github.com")] | length' 2>/dev/null || true)
          if [ "${humans:-0}" -gt 0 ]; then
            gh pr comment events-sync --body-file body.md
            exit 0
          fi
          git switch -C events-sync
          git commit -qm "Sync holidays and occasions with time.ir" --allow-empty
          git push -f origin events-sync
          if gh pr view events-sync --json state -q .state 2>/dev/null | grep -qx OPEN; then
            gh pr edit events-sync --body-file body.md
          else
            gh pr create --head events-sync --title "Sync holidays and occasions with time.ir" --body-file body.md
          fi
