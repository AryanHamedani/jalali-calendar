name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conversion and model tests (cross-checked against ICU)
        run: node test/model-test.js
      - name: Event data is valid JSON
        run: for f in events/*.json; do jq -e . "$f" >/dev/null || exit 1; done
      - name: Every Persian title has an English one
        run: |
          missing=$(jq -rn --slurpfile en events/en.json '
            [inputs] as [$nat, $intl, $y1, $y2, $y3]
            | ([$nat, $intl][] | .[][] | .title), ([$y1, $y2, $y3][] | .[] | .events[])
            | select($en[0][.] == null)' events/national.json events/international.json events/14*.json)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
      - name: Manifest
        run: jq -e '.schemaVersion == 1 and .entryPoints.barWidget == "BarWidget.qml"' manifest.json
