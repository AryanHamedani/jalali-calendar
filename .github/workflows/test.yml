name: test
# workflow_dispatch: the events sync starts it on its pull request, which a
# GITHUB_TOKEN push alone would not.
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: JavaScript core, cross-checked against ICU
        run: node tests/model-test.js
      - name: Python core and command, cross-checked against the JavaScript core
        run: python3 -m unittest discover -s tests -v
      - name: Shell scripts
        run: shellcheck install.sh bin/fetch-events
      - name: Waybar module is valid JSON once comments are stripped
        run: sed 's#^\s*//.*##' waybar/module.jsonc | jq -e '."custom/jalali".exec'
      - name: Event data is valid JSON
        run: for f in events/*.json; do jq -e . "$f" >/dev/null || exit 1; done
      - name: Every Persian title has an English one
        run: |
          missing=$(jq -rn --slurpfile en events/en.json '
            [inputs] as $files
            | ($files[:2][] | .[][] | .title), ($files[2:][] | .[] | .events[])
            | select($en[0][.] == null)' events/national.json events/international.json events/14*.json)
          [ -z "$missing" ] || { echo "$missing"; exit 1; }
      - name: Omarchy manifest points at a file that exists
        run: test -f "$(jq -r .entryPoints.barWidget manifest.json)"
